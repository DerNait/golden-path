<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Golden Path">
  <defs>
    <linearGradient id="gp-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d99b25"/>
      <stop offset="0.55" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#ffe6a3"/>
    </linearGradient>
    <radialGradient id="gp-glow" cx="0.74" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#f4c95d" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f4c95d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#0b0f14"/>
  <rect width="512" height="512" rx="112" fill="url(#gp-glow)"/>

  <!-- The climb: each step is one more session logged. -->
  <path d="M120 392 H 216 V 312 H 312 V 232 H 400" fill="none" stroke="url(#gp-gold)"
        stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The goal waiting at the top. -->
  <path fill="#ffe6a3" d="M400 96c5 30 17 42 47 47-30 5-42 17-47 47-5-30-17-42-47-47 30-5 42-17 47-47z"/>
</svg>
