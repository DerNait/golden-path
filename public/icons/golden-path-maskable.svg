    <path d="M120 392 H 216 V 312 H 312 V 232 H 400" fill="none" stroke="url(#gp-mask-gold)"
          stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <path fill="#ffe6a3" d="M400 96c5 30 17 42 47 47-30 5-42 17-47 47-5-30-17-42-47-47 30-5 42-17 47-47z"/>
  </g>
