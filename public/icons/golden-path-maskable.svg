<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Golden Path">
  <defs>
    <linearGradient id="gp-mask-gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#d99b25"/>
      <stop offset="0.55" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#ffe6a3"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="#0b0f14"/>

  <!-- Same climb, pulled into the safe zone so a circular mask cannot cut it. -->
